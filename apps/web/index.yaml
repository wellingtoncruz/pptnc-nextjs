# Datastore Composite Indexes
# Deploy with: gcloud datastore indexes create index.yaml
#
# Using videoType field for equality filters, enabling:
# - Direct ordering by publishedAt
# - Database-level pagination with limit/offset
# - Optimal query performance

indexes:
  # Index for getEpisodes(), getLatestEpisode()
  # Supports: filter videoType + order by publishedAt desc
  - kind: videos
    properties:
      - name: videoType
      - name: publishedAt
        direction: desc

  # Index for getEpisodesByTopic()
  # Supports: filter topics + videoType + order by publishedAt desc
  - kind: videos
    properties:
      - name: topics
      - name: videoType
      - name: publishedAt
        direction: desc

  # Index for getEpisodesCountByTopic()
  # Supports: filter topics + videoType (count query)
  - kind: videos
    properties:
      - name: topics
      - name: videoType

  # Index for getAllTopics() projection query
  # Supports: filter videoType + select topics
  - kind: videos
    properties:
      - name: videoType
      - name: topics
