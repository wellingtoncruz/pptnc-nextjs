substitutions:
  _SERVICE_NAME: pptnc-prod
  _REGION: us-east1
  _REPOSITORY: pptnc
  _SERVICE_ACCOUNT: pptnc-build@pptnc-stage.iam.gserviceaccount.com
  _TAG: ${TAG_NAME}
  # Firestore named DB. Cloud Build = produção (mesma convenção da iara), então
  # default pptnc-prod. Aplicado no build (SSG lê o Firestore) e no runtime.
  _FIRESTORE_DATABASE_ID: pptnc-prod

steps:
  # Step 1: Install Dependencies with pnpm
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'corepack enable && pnpm install --frozen-lockfile'

  # Step 2: Build Next.js (SSG happens here with Firestore access)
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'corepack enable && pnpm --filter @pptnc/web build'
    env:
      - 'GOOGLE_PROJECT_ID=$PROJECT_ID'
      - 'NEXT_PUBLIC_PROJECT_ID=$PROJECT_ID'
      - 'FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID}'

  # Step 3: Build Docker image (copies pre-built artifacts)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/web/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:stable'
      - '.'

  # Step 4: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}'

  # Step 5: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:stable'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - '${_SERVICE_ACCOUNT}'
      # Runtime DB selection. --update-env-vars merges (não apaga UPSTASH/RESEND/etc).
      - '--update-env-vars'
      - 'FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID}'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:stable'

options:
  logging: CLOUD_LOGGING_ONLY
