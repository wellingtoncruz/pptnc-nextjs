substitutions:
  _SERVICE_NAME: pptnc-prod
  _REGION: us-east1
  _REPOSITORY: pptnc
  _SERVICE_ACCOUNT: pptnc-build@pptnc-stage.iam.gserviceaccount.com
  _TAG: ${TAG_NAME}
  # Firestore named DB. Cloud Build = produção (mesma convenção da iara), então
  # default pptnc-prod. Aplicado no build (SSG lê o Firestore) e no runtime.
  _FIRESTORE_DATABASE_ID: pptnc-prod
  # GA4 measurement ID. Precisa existir no BUILD: NEXT_PUBLIC_* é inlined pelo
  # Next no bundle do cliente, então definir só no runtime do Cloud Run não
  # funciona (o AnalyticsProvider renderiza null e nenhuma tag é injetada).
  # Não é segredo — o ID é público, aparece no HTML servido.
  # Fluxo "PPTNC - Produção" (URL pptnaocompila.com.br). Antes de trocar este
  # valor, confirme que o Google serve tag para ele:
  #   curl -s -o /dev/null -w "%{http_code} %{size_download}\n" \
  #     "https://www.googletagmanager.com/gtag/js?id=<ID>"
  # ID inexistente devolve 200 com stub genérico (~427 KB); ID válido devolve
  # ~520 KB. Existir na UI do GA não basta — o fluxo anterior dava 404.
  _GA_MEASUREMENT_ID: G-VXMSFJHLQ9

steps:
  # Step 1: Install Dependencies with pnpm
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'corepack enable && pnpm install --frozen-lockfile'

  # Step 2: Build Next.js (SSG happens here with Firestore access)
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'corepack enable && pnpm --filter @pptnc/web build'
    env:
      - 'GOOGLE_PROJECT_ID=$PROJECT_ID'
      - 'NEXT_PUBLIC_PROJECT_ID=$PROJECT_ID'
      - 'FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID}'
      - 'NEXT_PUBLIC_GA_MEASUREMENT_ID=${_GA_MEASUREMENT_ID}'

  # Step 3: Build Docker image (copies pre-built artifacts)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/web/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:stable'
      - '.'

  # Step 4: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}'

  # Step 5: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:stable'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - '${_SERVICE_ACCOUNT}'
      # Runtime DB selection. --update-env-vars merges (não apaga UPSTASH/RESEND/
      # YOUTUBE_API_KEY/etc — runtime envs persistem na revisão do Cloud Run).
      - '--update-env-vars'
      - 'FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID}'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:stable'

options:
  logging: CLOUD_LOGGING_ONLY
