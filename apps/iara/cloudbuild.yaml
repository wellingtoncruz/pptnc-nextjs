# Cloud Build configuration for IAra
# Triggered on push to main branch when apps/iara/** changes
#
# To set up trigger in GCP Console:
# 1. Go to Cloud Build > Triggers
# 2. Create trigger with:
#    - Event: Push to branch
#    - Branch: ^main$
#    - Included files: apps/iara/**
#    - Cloud Build configuration file: apps/iara/cloudbuild.yaml

substitutions:
  _SERVICE_NAME: iara-prod
  _REGION: us-east1
  _REPOSITORY: pptnc
  _SERVICE_ACCOUNT: pptnc-build@pptnc-stage.iam.gserviceaccount.com
  _TAG: ${TAG_NAME}

steps:
  # Step 1: Install Dependencies with pnpm
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'corepack enable && pnpm install --frozen-lockfile'

  # Step 2: Build Next.js application
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'corepack enable && pnpm --filter iara build'
    env:
      - 'GOOGLE_PROJECT_ID=$PROJECT_ID'

  # Step 3: Build Docker image (copies pre-built artifacts)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/iara/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:stable'
      - '.'

  # Step 4: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}'

  # Step 5: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:stable'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - '${_SERVICE_ACCOUNT}'
      - '--memory'
      - '1Gi'
      - '--timeout'
      - '300'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:stable'

options:
  logging: CLOUD_LOGGING_ONLY
