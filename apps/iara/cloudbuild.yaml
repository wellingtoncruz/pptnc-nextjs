# Cloud Build configuration for IAra
# Triggered on push to main branch when apps/iara/** changes
#
# To set up trigger in GCP Console:
# 1. Go to Cloud Build > Triggers
# 2. Create trigger with:
#    - Event: Push to branch
#    - Branch: ^main$
#    - Included files: apps/iara/**
#    - Cloud Build configuration file: apps/iara/cloudbuild.yaml
#
# For a new podcast, create a separate trigger with substitution overrides:
#   _SERVICE_NAME=iara-novo-podcast
#   _PODCAST_ID=novo-podcast
#   _FIRESTORE_DATABASE_ID=pptnc-stage

substitutions:
  _SERVICE_NAME: iara-prod
  _REGION: us-east1
  _REPOSITORY: pptnc
  _SERVICE_ACCOUNT: pptnc-build@pptnc-stage.iam.gserviceaccount.com
  _PODCAST_ID: pptnc
  _FIRESTORE_DATABASE_ID: pptnc-stage

steps:
  # Step 1: Build Docker image (multi-stage build includes deps + Next.js build)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/iara/Dockerfile'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_VERSION=$TAG_NAME'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$TAG_NAME'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:stable'
      - '.'

  # Step 2: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}'

  # Step 3: Deploy to Cloud Run with tenant env vars
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:stable'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - '${_SERVICE_ACCOUNT}'
      - '--memory'
      - '1Gi'
      - '--timeout'
      - '300'
      - '--update-env-vars'
      - 'PODCAST_ID=${_PODCAST_ID},GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION},FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID}'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$TAG_NAME'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:stable'

options:
  logging: CLOUD_LOGGING_ONLY
